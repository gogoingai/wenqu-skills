name: Release checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  static-release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: gogoingai/skills-eval@v0.2.0
        with:
          path: .
          comment: true
          external-targets: claude-plugin,workbuddy,clawhub
