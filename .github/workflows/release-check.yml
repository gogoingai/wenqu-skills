name: Release checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  static-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:release
      - run: npm run release:check
